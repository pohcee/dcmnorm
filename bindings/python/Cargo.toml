[package]
name = "dcmnorm-python"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "dcmnorm"
# "rlib" is needed for the crate to be usable by `cargo test --doc`/unit tests within this
# crate itself; "cdylib" is what maturin actually loads as the Python extension module.
crate-type = ["cdylib", "rlib"]

[dependencies]
dcmnorm = { path = "../.." }
dicom-core = "0.9.1"
dicom-object = "0.9.1"
# abi3-py39: one compiled extension works unmodified against any CPython >= 3.9 (stable ABI) -
# the Python analog of napi-rs's own single-binary-per-platform story (see this crate's
# README/Packaging section), rather than needing one wheel per Python minor version.
pyo3 = { version = "0.23", features = ["abi3-py39"] }
serde_json = "1.0"
