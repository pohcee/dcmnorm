[package]
name = "dcmtalk"
version.workspace = true
edition = "2021"
authors = ["Jason Klotzer <jason@enlyt.com>"]
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["dicom", "dimse", "pacs", "cli"]
categories = ["command-line-utilities", "network-programming"]
include = ["/src/**"]
description = "DICOM network (DIMSE) CLI: echoscu/storescu/findscu/movescu/storescp"

[[bin]]
name = "dcmtalk"
path = "src/main.rs"

[package.metadata.deb]
extended-description = """\
A DIMSE (DICOM network) client/server covering the same ground as dcmtk's \
echoscu/storescu/findscu/movescu/storescp, built on this repository's own DICOM Upper Layer \
implementation."""
depends = "$auto, ca-certificates, ffmpeg"
section = "utils"
priority = "optional"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dcmnorm = { path = "../..", version = "=0.20.1" }
sha2 = "0.10"
