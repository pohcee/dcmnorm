[package]
name = "dcmnorm-cli"
version = "0.2.4"
edition = "2021"
authors = ["Jason Klotzer <jason@enlyt.com>"]
license = "Apache-2.0"
description = "DICOM read/write/transcode/render CLI"

[features]
default = []
kakadu-ffi = ["dcmnorm/kakadu-ffi"]

[[bin]]
name = "dcmnorm"
path = "src/main.rs"

[package.metadata.deb]
name = "dcmnorm"
extended-description = """\
Converts between DICOM, transcoded DICOM, JSON, and rendered images/raw frames; edits DICOM \
elements; validates files; and renders pixel data to PNG/JPEG/raw/MPEG4/GPU-texture."""
depends = "$auto, ca-certificates, ffmpeg"
section = "utils"
priority = "optional"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dcmnorm = { path = "../.." }
dcmnorm-core = { path = "../../crates/dcmnorm-core" }
dcmnorm-dictionary = { path = "../../crates/dcmnorm-dictionary" }
dcmnorm-object = { path = "../../crates/dcmnorm-object" }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
flate2 = "1.0"
