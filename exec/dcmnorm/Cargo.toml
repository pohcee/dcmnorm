[package]
name = "dcmnorm-cli"
version.workspace = true
edition = "2021"
authors = ["Jason Klotzer <jason@enlyt.com>"]
license = "Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["dicom", "medical-imaging", "cli", "transcode"]
categories = ["command-line-utilities", "multimedia::images"]
include = ["/src/**"]
description = "DICOM read/write/transcode/render CLI"

[features]
default = []
kakadu-ffi = ["dcmnorm/kakadu-ffi"]

[[bin]]
name = "dcmnorm"
path = "src/main.rs"

[package.metadata.deb]
name = "dcmnorm"
extended-description = """\
Converts between DICOM, transcoded DICOM, JSON, and rendered images/raw frames; edits DICOM \
elements; validates files; and renders pixel data to PNG/JPEG/raw/MPEG4/GPU-texture."""
depends = "$auto, ca-certificates, ffmpeg"
section = "utils"
priority = "optional"

[lints.clippy]
# `!(step > 0.0)` is deliberate: it also rejects NaN.
neg_cmp_op_on_partial_ord = "allow"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dcmnorm = { path = "../..", version = "=0.19.0" }
dcmnorm-core = { path = "../../crates/dcmnorm-core", version = "=0.19.0" }
dcmnorm-dictionary = { path = "../../crates/dcmnorm-dictionary", version = "=0.19.0" }
dcmnorm-object = { path = "../../crates/dcmnorm-object", version = "=0.19.0" }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
flate2 = "1.0"
