[package]
name = "dcmnorm"
version = "0.2.4"
edition = "2021"
build = "build.rs"

[workspace]
members = [
	"crates/dcmnorm-core",
	"crates/dcmnorm-dictionary",
	"crates/dcmnorm-encoding",
	"crates/dcmnorm-transcode",
	"crates/dcmnorm-parser",
	"crates/dcmnorm-object",
	"crates/dcmnorm-dimse",
	"crates/dcmnorm-jpeg",
	"exec/dcmnorm",
	"exec/dcmtalk",
	"bindings/node",
	"bindings/python",
]
resolver = "2"

[features]
default = ["ffmpeg-codec", "jpeg-ls-codec", "jpeg-xl-codec"]
kakadu-ffi = []
ffmpeg-codec = ["dep:ffmpeg-next"]
jpeg-ls-codec = ["dep:charls"]
jpeg-xl-codec = ["dep:jxl-oxide"]

[dependencies]
base64 = "0.22"
dcmnorm-core = { path = "crates/dcmnorm-core" }
dcmnorm-dictionary = { path = "crates/dcmnorm-dictionary" }
dcmnorm-encoding = { path = "crates/dcmnorm-encoding" }
dcmnorm-object = { path = "crates/dcmnorm-object" }
dcmnorm-transcode = { path = "crates/dcmnorm-transcode", default-features = false, features = ["native", "deflate", "openjpeg-sys"] }
dcmnorm-dimse = { path = "crates/dcmnorm-dimse" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lcms2 = "6"
serde_json = "1.0"
ffmpeg-next = { version = "8.1", optional = true, default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
charls = { version = "0.4.2", optional = true }
jxl-oxide = { version = "0.10", optional = true }
rayon = "1.10"
flate2 = "1.0"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cc = "1.2"

# All seven original dicom-rs dependencies (dicom-core, dicom-dictionary-std, dicom-encoding,
# dicom-transfer-syntax-registry, dicom-parser, dicom-object, dicom-ul) have been fully
# replaced by in-house crates under crates/ - see each crate's README for its
# individual history (mechanical fork vs. from-scratch rewrite). All five forked crates were
# renamed off their original dicom-rs package/lib names once nothing left in the dependency
# graph needed the original names anymore (Phase 6 of the dicom-rs removal plan), so they're
# now plain path dependencies above rather than crates.io substitutions - no [patch.crates-io]
# entries needed for them.
#
# jpeg-decoder 0.3.2 was also vendored (fixing a Predictor::Ra / JPEG Lossless SV1 restart-
# interval bug that caused periodic banding on mammography lossless JPEG - common in Hologic
# C-View/tomosynthesis DICOM) and has since been fully absorbed as crates/dcmnorm-jpeg - see
# that crate's README. No crates.io jpeg-decoder dependency or patch remains.
