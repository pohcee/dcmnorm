[package]
name = "dcmnorm"
version = "0.3.1"
edition = "2021"
build = "build.rs"

[workspace]
members = [
	"crates/dcmnorm-core",
	"crates/dcmnorm-dictionary",
	"crates/dcmnorm-encoding",
	"crates/dcmnorm-transcode",
	"crates/dcmnorm-parser",
	"crates/dcmnorm-object",
	"crates/dcmnorm-dimse",
	"crates/dcmnorm-jpeg",
	"exec/dcmnorm",
	"exec/dcmtalk",
	"bindings/node",
	"bindings/python",
]
resolver = "2"

[features]
default = ["ffmpeg-codec", "jpeg-ls-codec", "jpeg-xl-codec", "jpeg2000-openjpeg-encode"]
kakadu-ffi = []
ffmpeg-codec = ["dep:ffmpeg-next"]
jpeg-ls-codec = ["dep:charls"]
jpeg-xl-codec = ["dep:jxl-oxide"]
jpeg2000-openjpeg-encode = ["dep:openjpeg-sys"]

[dependencies]
base64 = "0.22"
dcmnorm-core = { path = "crates/dcmnorm-core" }
dcmnorm-dictionary = { path = "crates/dcmnorm-dictionary" }
dcmnorm-encoding = { path = "crates/dcmnorm-encoding" }
dcmnorm-object = { path = "crates/dcmnorm-object" }
dcmnorm-transcode = { path = "crates/dcmnorm-transcode", default-features = false, features = ["native", "deflate", "openjpeg-sys"] }
dcmnorm-dimse = { path = "crates/dcmnorm-dimse" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lcms2 = "6"
serde_json = "1.0"
# "build" compiles FFmpeg from source (via ffmpeg-sys-next's build.rs: shallow git clone +
# ./configure + make) and statically links it, instead of dynamically linking whatever FFmpeg
# happens to be installed on the build machine. Without this, the resulting binary's exact
# required SONAMEs (e.g. libavutil.so.57) depend on which distro/version built it, and only
# match a *different* machine (a dev host, or a production container) by coincidence - see the
# incident this fixed: a bookworm-container-built dcmnorm-node addon dynamically linking
# libavutil.so.57 dlopen-failed both on an Ubuntu dev host (libavutil.so.58) and would have in
# production too, since Docker.tmpl's final image never installed matching runtime libs either.
# Static linking makes the compiled artifact fully portable - host, CI, or production all just
# work - at the cost of a slower first build (FFmpeg itself compiles from source) and requiring
# `git` and `nasm` on whatever machine runs `cargo build` with this feature on (see
# bindings/node/build-in-docker.sh for the container-side install).
ffmpeg-next = { version = "8.1", optional = true, default-features = false, features = ["codec", "format", "software-resampling", "software-scaling", "build"] }
charls = { version = "0.4.2", optional = true }
jxl-oxide = { version = "0.10", optional = true }
openjpeg-sys = { version = "1.0.12", optional = true, default-features = false }
rayon = "1.10"
flate2 = "1.0"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
openjph-core = "0.1.0"

[build-dependencies]
cc = "1.2"

# All seven original dicom-rs dependencies (dicom-core, dicom-dictionary-std, dicom-encoding,
# dicom-transfer-syntax-registry, dicom-parser, dicom-object, dicom-ul) have been fully
# replaced by in-house crates under crates/ - see each crate's README for its
# individual history (mechanical fork vs. from-scratch rewrite). All five forked crates were
# renamed off their original dicom-rs package/lib names once nothing left in the dependency
# graph needed the original names anymore (Phase 6 of the dicom-rs removal plan), so they're
# now plain path dependencies above rather than crates.io substitutions - no [patch.crates-io]
# entries needed for them.
#
# jpeg-decoder 0.3.2 was also vendored (fixing a Predictor::Ra / JPEG Lossless SV1 restart-
# interval bug that caused periodic banding on mammography lossless JPEG - common in Hologic
# C-View/tomosynthesis DICOM) and has since been fully absorbed as crates/dcmnorm-jpeg - see
# that crate's README. No crates.io jpeg-decoder dependency or patch remains.
