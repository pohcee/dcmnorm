[package]
name = "dcmnorm"
version = "0.2.4"
edition = "2021"
build = "build.rs"

[workspace]
members = [
	"exec/dcmnorm",
	"exec/dcmtalk",
	"bindings/node",
	"bindings/python",
]
resolver = "2"

[features]
default = ["ffmpeg-codec", "jpeg-ls-codec"]
kakadu-ffi = []
ffmpeg-codec = ["dep:ffmpeg-next"]
jpeg-ls-codec = ["dep:charls"]

[dependencies]
base64 = "0.22"
dicom-core = "0.9.1"
dicom-dictionary-std = "0.9.0"
dicom-encoding = "0.9.1"
dicom-object = "0.9.1"
dicom-transfer-syntax-registry = { version = "0.9.1", default-features = false, features = ["native", "deflate", "openjpeg-sys"] }
dicom-ul = "0.9.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
lcms2 = "6"
serde_json = "1.0"
ffmpeg-next = { version = "8.1", optional = true, default-features = false, features = ["codec", "format", "software-resampling", "software-scaling"] }
charls = { version = "0.4.2", optional = true }
rayon = "1.10"
flate2 = "1.0"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
cc = "1.2"

# Patched copy of jpeg-decoder 0.3.2: the Predictor::Ra (JPEG Lossless SV1) fast path in
# src/decoder/lossless.rs ignores restart-interval boundaries entirely, and the generic
# predictor path checks a stale scalar instead of a per-pixel restart flag. Both produce
# corrupted output (periodic banding) on any lossless JPEG that uses restart markers, which
# is common in mammography (Hologic C-View/tomosynthesis) DICOM. See vendor/jpeg-decoder
# for the fix; remove this patch once upstream (image-rs/jpeg-decoder) releases a fix.
#
# Patched copy of dicom-core 0.9.1: VR::from_binary only recognizes the 32 standard DICOM
# VR codes, so an unrecognized 2-byte VR field falls back to VR::UN (long-form, 4-byte
# length) in dicom-encoding's explicit VR decoders. Some vendor DICOM writers instead write
# their own internal ambiguous-VR dictionary placeholder literally into the file - e.g.
# "xs" meaning "US or SS" - which is short-form (2-byte length) like the VR it stands in
# for, so the VR::UN fallback misreads the length field and desyncs the rest of the
# dataset ("Could not read data set token" from dicom-object). Also resolves "ox" ("OB or
# OW") for VR-reporting consistency, per dcmjs's dictionary, though that one was never
# parse-breaking. See vendor/dicom-core for the fix; remove this patch once upstream
# (dicom-rs) tolerates non-standard VR bytes without erroring.
[patch.crates-io]
jpeg-decoder = { path = "vendor/jpeg-decoder" }
dicom-core = { path = "vendor/dicom-core" }
