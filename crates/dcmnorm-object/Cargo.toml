[package]
name = "dcmnorm-object"
version = "0.1.0"
edition = "2021"
description = "In-house DICOM in-memory object model and Part 10 file I/O, replacing dicom-object. See README.md."
license = "MIT OR Apache-2.0"

[lib]
name = "dcmnorm_object"
path = "src/lib.rs"

[dependencies]
dcmnorm-core = { path = "../dcmnorm-core" }
dcmnorm-dictionary = { path = "../dcmnorm-dictionary" }
dcmnorm-encoding = { path = "../dcmnorm-encoding" }
dcmnorm-parser = { path = "../dcmnorm-parser" }
dcmnorm-transcode = { path = "../dcmnorm-transcode", default-features = false }
smallvec = "1.6.1"
snafu = "0.8"
