[package]
name = "dcmnorm-transcode"
version.workspace = true
authors = ["Eduardo Pinho <enet4mikeenet@gmail.com>"]
description = "DICOM transfer-syntax registry and pixel codecs for dcmnorm, forked from dicom-transfer-syntax-registry 0.9.1. See README.md."
edition = "2018"
rust-version = "1.72.0"
license = "MIT OR Apache-2.0"
keywords = ["dicom"]
readme = "README.md"
repository.workspace = true
homepage.workspace = true
include = ["/src/**", "/README.md"]

[package.metadata.docs.rs]
features = ["native"]

[lib]
name = "dcmnorm_transcode"
path = "src/lib.rs"

[features]
default = []
# deflated transfer syntax reading and writing via flate2
deflate = ["dep:flate2"]
# natively implemented image encodings
native = ["jpeg", "rle"]
# native JPEG support: decode via the in-house dcmnorm-jpeg, encode via jpeg-encoder
jpeg = ["dep:dcmnorm-jpeg", "dep:jpeg-encoder"]
# JPEG 2000 (classic and HTJ2K) via dcmnorm-jpeg2000
jpeg2000 = ["dep:dcmnorm-jpeg2000"]
# native RLE lossless support
rle = []
# enable SIMD operations for JPEG encoding
simd = ["jpeg-encoder?/simd"]

[dependencies]
byteordered = "0.6"
dcmnorm-core = { path = "../dcmnorm-core", version = "=0.20.0" }
dcmnorm-encoding = { path = "../dcmnorm-encoding", version = "=0.20.0" }
dcmnorm-jpeg = { path = "../dcmnorm-jpeg", version = "=0.20.0", optional = true }
dcmnorm-jpeg2000 = { path = "../dcmnorm-jpeg2000", version = "=0.20.0", optional = true }
flate2 = { version = "1.0.28", optional = true }
jpeg-encoder = { version = "0.6", optional = true }
lazy_static = "1.2.0"
tracing = "0.1.34"

# Upstream's dev-dependencies (dicom-test-files, dicom-object) and their tests/ directory
# were deliberately not ported - see README.md's "What was left out" section.
#
# charls/jpeg-ls, jxl-oxide/zune-jpegxl/JPEG-XL, the inventory-registry feature and upstream's
# jpeg2k-based openjp2/openjpeg-sys features were removed entirely - dcmnorm's own JPEG-LS path
# calls charls directly, bypassing this registry, and JPEG 2000 goes through dcmnorm-jpeg2000.
# See README.md's "Trimmed to dcmnorm's actual surface" section.
