[package]
name = "dcmnorm-jpeg"
version.workspace = true
authors = ["The image-rs Developers"]
description = "JPEG baseline/extended/lossless decoder for dcmnorm, forked from jpeg-decoder 0.3.2. See README.md."
edition = "2021"
rust-version = "1.61.0"
license = "MIT OR Apache-2.0"
keywords = ["jpeg", "jpg", "decoder", "image"]
readme = "README.md"
repository.workspace = true
homepage.workspace = true
include = ["/src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT", "/CHANGELOG.md"]
# The upstream tests, benches and example were kept in the repository but are not built (their
# dev-dependencies and fixtures were not ported).
autotests = false
autoexamples = false
autobenches = false

[lib]
name = "dcmnorm_jpeg"
path = "src/lib.rs"

[dependencies]

[features]
platform_independent = []
# Opt-in, this depends on Rust nightly. Will be changed to a no-op feature when
# the Rust feature is stabilized which is expected to be 1.61.
nightly_aarch64_neon = []
