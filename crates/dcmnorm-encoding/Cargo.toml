[package]
name = "dcmnorm-encoding"
version.workspace = true
authors = ["Eduardo Pinho <enet4mikeenet@gmail.com>"]
description = "DICOM encoding/decoding primitives for dcmnorm, forked from dicom-encoding 0.9.1. See README.md."
edition = "2018"
rust-version = "1.72.0"
license = "MIT OR Apache-2.0"
categories = ["encoding"]
keywords = ["dicom"]
readme = "README.md"
repository.workspace = true
homepage.workspace = true
include = ["/src/**", "/README.md"]

[lib]
name = "dcmnorm_encoding"
path = "src/lib.rs"

[dependencies]
dcmnorm-core = { path = "../dcmnorm-core", version = "=0.19.0" }
dcmnorm-dictionary = { path = "../dcmnorm-dictionary", version = "=0.19.0" }
encoding = "0.2.33"
byteordered = "0.6"
snafu = "0.8"
