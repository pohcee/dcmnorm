[package]
name = "dcmnorm-core"
version.workspace = true
authors = ["Eduardo Pinho <enet4mikeenet@gmail.com>"]
description = "DICOM core value/VR/tag types for dcmnorm, forked from dicom-core 0.9.1. See README.md."
edition = "2018"
rust-version = "1.72.0"
license = "MIT OR Apache-2.0"
keywords = ["dicom"]
readme = "README.md"
repository.workspace = true
homepage.workspace = true
include = ["/src/**", "/tests/**", "/README.md"]

[lib]
name = "dcmnorm_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.31", default-features = false, features = ["std", "clock"] }
either = "1.13.0"
itertools = "0.14"
num-traits = "0.2.12"
safe-transmute = "0.11.0"
smallvec = "1.6.1"
snafu = "0.8"
