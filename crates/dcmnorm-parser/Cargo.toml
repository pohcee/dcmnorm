[package]
name = "dcmnorm-parser"
version.workspace = true
authors = ["Eduardo Pinho <enet4mikeenet@gmail.com>"]
description = "DICOM dataset streaming reader/writer for dcmnorm, forked from dicom-parser 0.9.1. See README.md."
edition = "2018"
rust-version = "1.72.0"
license = "MIT OR Apache-2.0"
categories = ["parser-implementations"]
keywords = ["dicom", "parser"]
readme = "README.md"
repository.workspace = true
homepage.workspace = true
include = ["/src/**", "/README.md"]

[lib]
name = "dcmnorm_parser"
path = "src/lib.rs"

[dependencies]
dcmnorm-core = { path = "../dcmnorm-core", version = "=0.20.0" }
dcmnorm-encoding = { path = "../dcmnorm-encoding", version = "=0.20.0" }
dcmnorm-dictionary = { path = "../dcmnorm-dictionary", version = "=0.20.0" }
smallvec = "1.6.1"
snafu = "0.8"
tracing = "0.1.34"
