[package]
name = "dcmnorm-dimse"
version.workspace = true
edition = "2021"
description = "In-house DICOM Upper Layer Protocol (PS3.8) implementation, replacing dicom-ul. See lib.rs."
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
keywords = ["dicom", "dimse", "pacs", "network"]
include = ["/src/**"]

[lib]
name = "dcmnorm_dimse"
path = "src/lib.rs"

[dependencies]
dcmnorm-encoding = { path = "../dcmnorm-encoding", version = "=0.20.1" }
dcmnorm-transcode = { path = "../dcmnorm-transcode", version = "=0.20.1", default-features = false }
