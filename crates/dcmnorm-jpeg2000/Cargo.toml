[package]
name = "dcmnorm-jpeg2000"
version.workspace = true
edition = "2021"
description = "Pure-Rust JPEG 2000 Part 1 and HTJ2K Part 15 codecs for dcmnorm (backed by j2k), with an explicit threading policy."
license = "MIT OR Apache-2.0"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["jpeg2000", "htj2k", "dicom", "codec"]
include = ["/src/**", "/README.md"]

[dependencies]
j2k = { git = "https://github.com/jpambrun/j2k", branch = "perf/all-staged" }
rayon = "1.10"
