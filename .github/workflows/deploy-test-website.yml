name: Deploy Test Website

# Rebuilds bindings/node/examples/test-website and redeploys it to Cloud Run whenever the Node
# binding (or the site itself) changes on main, so the public demo never lags behind the latest
# dcmnorm-node version. Same image + service as deploy-cloudrun.sh, which stays the manual path.
#
# Triggers:
#   - push to main touching bindings/node/** - a human commit (e.g. a "Release 0.1.x" version
#     bump with its rebuilt .node, or a test-website change).
#   - workflow_run of Build Bindings - that workflow's own commit of the rebuilt .node is pushed
#     with GITHUB_TOKEN, which GitHub deliberately excludes from firing `push` triggers (see
#     release.yml's comment), so `push` above never sees it. workflow_run always runs against
#     main's tip, i.e. after that commit has landed.
#   - workflow_dispatch - on-demand redeploy.
#
# Auth is keyless Workload Identity Federation (no SA key). The provider only trusts this repo on
# refs/heads/main and only for this one AR repo + Cloud Run service. The service runs as a
# zero-role SA, not the project's default compute SA.
#
# Deployment identifiers come from repository secrets (secrets, not variables, so they are masked
# in the public Actions logs). When any is missing - e.g. on a fork - the deploy job is skipped:
#   TEST_WEBSITE_GCP_PROJECT   GCP project id hosting the Artifact Registry repo + Cloud Run service
#   TEST_WEBSITE_RUNTIME_SA    email of the service account the Cloud Run service runs as
#   TEST_WEBSITE_WIF_PROVIDER  full Workload Identity provider resource name
#                              (projects/<number>/locations/global/workloadIdentityPools/<pool>/providers/<provider>)
#
# Each deploy sets the image plus CPU/memory (`gcloud run deploy` keeps every other setting); the
# public allUsers invoker binding was set once by deploy-cloudrun.sh and persists. 4 vCPU so the
# timings the site shows reflect dcmnorm's multi-threaded JPEG 2000 decode the way a production
# server (8 vCPU) runs it - on 1 vCPU codec threading has nothing to work with. Cloud Run
# requires at least 2Gi for 4 vCPU. Keep in sync with
# bindings/node/examples/test-website/deploy-cloudrun.sh.

on:
  push:
    branches: [main]
    paths:
      - bindings/node/**
      - test/files/**
      - .github/workflows/deploy-test-website.yml
  # No `branches:` filter here: it matches the *triggering* run's branch, and Build Bindings runs
  # on the release tag (head_branch = v0.4.1, not main), so a main filter silently skips every
  # release. This job still checks out main, and the OIDC token's ref is main either way
  # (workflow_run executes in the default branch's context), which the WIF condition requires.
  workflow_run:
    workflows: [Build Bindings]
    types: [completed]
  workflow_dispatch: {}

# Newer commit supersedes an in-flight deploy - only the latest version matters.
concurrency:
  group: deploy-test-website
  cancel-in-progress: true

env:
  REGION: us-central1
  REPOSITORY: dcmnorm
  SERVICE_NAME: dcmnorm-test-website
  MAX_UPLOAD_BYTES: "25000000"

jobs:
  # `secrets` can't be referenced in a job-level `if:`, so presence is checked here and exposed as
  # an output (a boolean only - never the values).
  configured:
    name: Check deploy configuration
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - name: Check required secrets
        id: check
        shell: bash
        env:
          HAS_PROJECT: ${{ secrets.TEST_WEBSITE_GCP_PROJECT != '' }}
          HAS_RUNTIME_SA: ${{ secrets.TEST_WEBSITE_RUNTIME_SA != '' }}
          HAS_WIF_PROVIDER: ${{ secrets.TEST_WEBSITE_WIF_PROVIDER != '' }}
        run: |
          if [[ "$HAS_PROJECT" == true && "$HAS_RUNTIME_SA" == true && "$HAS_WIF_PROVIDER" == true ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Test website deploy secrets are not configured; skipping deploy."
          fi

  deploy:
    name: Build and deploy
    needs: configured
    # Build Bindings is triggered by tags; a failed/cancelled run committed nothing new to deploy.
    if: >-
      needs.configured.outputs.ok == 'true' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.TEST_WEBSITE_GCP_PROJECT }}
      RUNTIME_SA: ${{ secrets.TEST_WEBSITE_RUNTIME_SA }}
      WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.TEST_WEBSITE_WIF_PROVIDER }}
    steps:
      # The project number is only a substring of the provider secret, so it is not masked on its
      # own - but it appears in Cloud Run's deterministic service URL. Mask it explicitly.
      - name: Mask derived identifiers
        shell: bash
        run: |
          PROJECT_NUMBER="$(cut -d/ -f2 <<<"$WORKLOAD_IDENTITY_PROVIDER")"
          [[ -n "$PROJECT_NUMBER" ]] && echo "::add-mask::${PROJECT_NUMBER}"
          true

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and push image
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE_NAME}"
          VERSION="$(jq -r .version bindings/node/package.json)"
          TAG="${VERSION}-${GITHUB_SHA::7}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -f bindings/node/examples/test-website/Dockerfile \
            -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
          docker push "${IMAGE}:${TAG}"
          docker push "${IMAGE}:latest"
          echo "ref=${IMAGE}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Deploy to Cloud Run
        shell: bash
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE_NAME" \
            --project="$PROJECT_ID" \
            --region="$REGION" \
            --image="${{ steps.image.outputs.ref }}" \
            --service-account="$RUNTIME_SA" \
            --cpu=4 \
            --memory=2Gi \
            --set-env-vars="MAX_UPLOAD_BYTES=${MAX_UPLOAD_BYTES}" \
            --verbosity=error \
            --quiet

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          URL="$(gcloud run services describe "$SERVICE_NAME" --project="$PROJECT_ID" \
            --region="$REGION" --format='value(status.url)')"
          WANT="$(jq -r .version bindings/node/package.json)"
          GOT="$(curl -fsS --retry 5 --retry-all-errors "${URL}/api/version" | jq -r .dcmnormNodeVersion)"
          echo "Deployed ${URL}: dcmnorm-node ${GOT}"
          [[ "$GOT" == "$WANT" ]] || { echo "::error::expected dcmnorm-node ${WANT}, live is ${GOT}"; exit 1; }
          echo "### Deployed dcmnorm-node ${GOT} to ${URL}" >> "$GITHUB_STEP_SUMMARY"
