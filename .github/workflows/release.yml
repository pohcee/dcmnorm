name: Build and release

# One workflow for everything that builds, tests and publishes dcmnorm.
#
#   pull_request, push to main   test + build every CLI artifact (nothing is published)
#   push of a v*.*.* tag         the same, then publish: GitHub release (archives + .deb),
#                                PyPI (CLI wheels), and the bindings' rebuilt native artifacts
#                                committed to main
#   workflow_dispatch            run on a ref by hand; on a tag ref it publishes like a tag push
#
# Releases start with ./scripts/release-tag.sh <patch|minor|major>, which bumps the Cargo
# versions (and the Claude plugin/skill version pins), commits, and pushes the tag with your own
# git credentials, so the tag push triggers this workflow. If a tag ever arrives without a run
# (GitHub doesn't start workflows for refs pushed with a run's own GITHUB_TOKEN), dispatch this
# workflow by hand with the tag as the ref.
#
# Publishing only happens after the tests and every CLI build pass. PyPI publishing uses Trusted
# Publishing (OIDC, no token stored) and runs only when the repository variable PYPI_PUBLISH is
# "true", so tags work before PyPI is set up: see packaging/README.md.

on:
  push:
    branches: [main]
    tags:
      - v*.*.*
      - v*.*.*-*
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR supersedes its run; a tag or main run always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        # ffmpeg: the video transfer syntax round-trip tests run through the ffmpeg command.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ffmpeg

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        # The bindings link FFmpeg built from source and are built in their own jobs below.
        run: >-
          cargo test --release --locked --workspace
          --exclude dcmnorm-node --exclude dcmnorm-python --exclude dcmnorm-java

      - name: Check version pins
        run: python3 scripts/check-versions.py

  cli:
    name: CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in a manylinux_2_28 container (glibc 2.28+), on a runner of the
          # same architecture; see packaging/build-linux.sh.
          - platform: linux-x86_64
            os: ubuntu-24.04
            bin_dir: target/manylinux_2_28-x86_64/release
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            bin_dir: target/manylinux_2_28-aarch64/release
          - platform: macos-aarch64
            os: macos-15
            bin_dir: target/release
            macos_target: "11.0"
          - platform: macos-x86_64
            os: macos-15-intel
            bin_dir: target/release
            macos_target: "10.15"
          - platform: windows-x86_64
            os: windows-2025
            bin_dir: target/release
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        # packaging/*.py use only the standard library; this just gives every runner a `python`.
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache cargo build
        if: ${{ !startsWith(matrix.platform, 'linux-') }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Build (manylinux container)
        if: startsWith(matrix.platform, 'linux-')
        run: packaging/build-linux.sh

      - name: Build
        if: ${{ !startsWith(matrix.platform, 'linux-') }}
        run: cargo build --release --locked -p dcmnorm-cli -p dcmtalk

      - name: Package archives and wheel
        shell: bash
        run: python packaging/package.py --platform ${{ matrix.platform }} --bin-dir ${{ matrix.bin_dir }} --out-dir dist

      - name: Smoke test the wheel
        shell: bash
        run: python packaging/smoke_test.py dist/*.whl

      - name: Build .deb packages
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked
          # cargo-deb packages target/release/<bin>; put the manylinux binaries there.
          mkdir -p target/release
          cp ${{ matrix.bin_dir }}/dcmnorm ${{ matrix.bin_dir }}/dcmtalk target/release/
          TAG="v$(python -c 'import sys; sys.path.insert(0, "packaging"); import package; print(package.cargo_version())')"
          for BIN in dcmnorm dcmtalk; do
            PKG=$([ "$BIN" = dcmnorm ] && echo dcmnorm-cli || echo dcmtalk)
            cargo deb --no-build --no-strip -p "$PKG"
            SRC="$(ls target/debian/${BIN}_*.deb)"
            for NAME in "${BIN}-${TAG}-${{ matrix.platform }}.deb" "${BIN}-${{ matrix.platform }}.deb"; do
              cp "$SRC" "dist/$NAME"
              (cd dist && sha256sum "$NAME" > "$NAME.sha256")
            done
            rm "$SRC"
          done
          # Install both packages for real and run them.
          sudo apt-get update
          sudo apt-get install -y ./dist/dcmnorm-${{ matrix.platform }}.deb ./dist/dcmtalk-${{ matrix.platform }}.deb
          dcmnorm --version
          dcmtalk --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  # --- Bindings: rebuilt on release tags (and by hand), committed back to main -----------------
  # Each binding's README ("Packaging") says why their native artifacts are committed rather
  # than built by consumers. The builds are straight invocations of each binding's own
  # build-in-docker.sh, and link FFmpeg built from source, so they only run when publishing.

  build-node:
    name: Bindings (Node, Linux)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run build-in-docker.sh
        run: bindings/node/build-in-docker.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dcmnorm-node-binary
          path: bindings/node/dcmnorm-node.linux-x64-gnu.node
          if-no-files-found: error

  build-node-windows:
    name: Bindings (Node, Windows)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    # Windows consumers of the Node binding run the same Node code natively, so they need a
    # win32 build of the addon: bindings/node/index.js (napi-generated) already resolves
    # ./dcmnorm-node.win32-x64-msvc.node on win32/x64. Built natively on a Windows runner (MSVC)
    # rather than cross-compiled - the C/C++ codec dependencies below (CharLS via cmake, OpenJPEG
    # via cc) need a real MSVC toolchain, which windows-latest already ships along with cmake,
    # Node and LLVM (libclang, for bindgen).
    #
    # The Linux and Windows addons must be consistent: this addon has every codec the Linux one
    # has, FFmpeg (MPEG-2/H.264/HEVC transfer syntaxes, renderMovie) included, and a codec that
    # fails to build fails the job - there is deliberately no fallback to a smaller feature set.
    # Linux builds FFmpeg from source (ffmpeg-codec -> ffmpeg-sys-next "build": ./configure +
    # make, which MSVC targets can't do), so here it is built by vcpkg instead and linked in with
    # ffmpeg-codec-linked.
    runs-on: windows-latest
    env:
      # vcpkg is checked out at a pinned commit rather than using the runner's preinstalled
      # (unpinned, usually stale) one: the ffmpeg port there must be the same 8.x line that
      # ffmpeg-sys-next 8.1 builds on Linux (release/8.1), and vcpkg master has moved on to 9.x,
      # which the ffmpeg-next 8.1 bindings don't target. cf1f98216 = ffmpeg 8.1.2.
      VCPKG_COMMIT: cf1f98216ddd83d3dc838e96ba1143801992f71e
      VCPKG_TRIPLET: x64-windows-static-md
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore vcpkg binary cache
        # The FFmpeg compile is the slow part (tens of minutes). vcpkg's files-based binary cache
        # keys each package by an ABI hash of its port, triplet, compiler and dependencies, so
        # restoring this directory turns a repeat run's install into a copy.
        # (restore + a separate save step below: the save runs even if a later step fails, so a
        # failed addon build doesn't throw away a good FFmpeg.)
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-ffmpeg-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_TRIPLET }}
          restore-keys: |
            vcpkg-ffmpeg-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_TRIPLET }}-

      - name: Install FFmpeg (vcpkg, static)
        shell: pwsh
        # Only the libraries dcmnorm links (ffmpeg-next features codec, format,
        # software-resampling, software-scaling = avcodec, avformat, swresample, swscale; avutil
        # comes with them). No optional ffmpeg features and no GPL/nonfree ports, so it is
        # LGPL-only with FFmpeg's native decoders/encoders, the same as the Linux source build
        # (--disable-autodetect, no external codec libraries). x64-windows-static-md = static
        # libs (no FFmpeg DLLs next to the .node) against the dynamic CRT, which Node's own
        # addons use too.
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'vcpkg'
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force $cache | Out-Null
          git init $root
          git -C $root fetch --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_COMMIT
          git -C $root checkout FETCH_HEAD
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'bootstrap-vcpkg failed' }
          $env:VCPKG_BINARY_SOURCES = "clear;files,$cache,readwrite"
          & "$root\vcpkg.exe" install "ffmpeg[core,avcodec,avformat,swresample,swscale]:$env:VCPKG_TRIPLET" --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install ffmpeg failed' }
          # Read by ffmpeg-sys-next's build.rs (try_vcpkg -> the vcpkg crate): VCPKG_ROOT locates
          # the install tree, VCPKGRS_TRIPLET picks the static triplet (the ffmpeg-next "static"
          # feature, enabled by ffmpeg-codec-linked, makes it link statically), and
          # LIBCLANG_PATH is bindgen's libclang (LLVM ships on windows-latest).
          "VCPKG_ROOT=$root" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "VCPKGRS_TRIPLET=$env:VCPKG_TRIPLET" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll')) { throw 'libclang.dll not found on runner' }

      - name: Save vcpkg binary cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\vcpkg-binary-cache
          key: vcpkg-ffmpeg-${{ env.VCPKG_COMMIT }}-${{ env.VCPKG_TRIPLET }}

      - name: Install npm dependencies
        working-directory: bindings/node
        # No package-lock.json is committed for bindings/node, so `npm ci` can't be used.
        run: npm install --no-audit --no-fund

      - name: Build addon
        working-directory: bindings/node
        shell: pwsh
        # Same codec set as the Linux addon (the default feature set), with ffmpeg-codec-linked in
        # place of ffmpeg-codec: jpeg-xl-codec is pure Rust (jxl-oxide), jpeg2000-openjpeg-encode
        # compiles vendored OpenJPEG C with cc, jpeg-ls-codec builds CharLS C++ via cmake, and
        # FFmpeg comes from the vcpkg install above. No nasm needed on this side.
        run: npx napi build --platform --release --target x86_64-pc-windows-msvc --no-default-features --features "ffmpeg-codec-linked,jpeg-ls-codec,jpeg-xl-codec,jpeg2000-openjpeg-encode"

      - name: Check the addon is self-contained
        working-directory: bindings/node
        shell: pwsh
        # FFmpeg must be linked in statically: a Windows consumer gets just the .node, so any
        # av*/sw* DLL import would be a load failure on their machine.
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) { throw 'dumpbin.exe not found' }
          $deps = & $dumpbin.FullName /dependents dcmnorm-node.win32-x64-msvc.node
          $deps | Write-Host
          $bad = $deps | Where-Object { $_ -match '^\s+(av|sw|postproc)[a-z]*-\d+\.dll\s*$' }
          if ($bad) { throw "addon imports FFmpeg DLLs (not statically linked): $bad" }

      - name: Load check
        working-directory: bindings/node
        shell: pwsh
        # Not test/smoke.js - that one is written for the Linux container (glibc check). Prove
        # the .node dlopens under the runner's Node, parses a DICOM fixture, and that FFmpeg works:
        # there is no MPEG-encoded fixture, so round-trip us.dcm through MPEG-2 (FFmpeg's native
        # mpeg2video encoder and decoder, 1.2.840.10008.1.2.4.100) and back to Explicit VR LE.
        # Without FFmpeg linked in, dcmnorm rejects the MPEG transfer syntax and this step fails.
        run: node load-check.js

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dcmnorm-node-binary-win32
          path: bindings/node/dcmnorm-node.win32-x64-msvc.node
          if-no-files-found: error

  build-python:
    name: Bindings (Python)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Remove the previously committed wheel
        # build-in-docker.sh itself only ever ADDS a file to dist/ (maturin's --out doesn't
        # clear it first) - without this, a fresh checkout's already-committed wheel would still
        # be sitting in dist/ right alongside the new one, and the artifact upload below would
        # pick up both.
        run: rm -f bindings/python/dist/*.whl

      - name: Run build-in-docker.sh
        run: bindings/python/build-in-docker.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dcmnorm-python-wheel
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  build-java:
    name: Bindings (Java)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run build-in-docker.sh
        run: bindings/java/build-in-docker.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dcmnorm-java-native
          path: bindings/java/src/main/resources/native/linux-x64/libdcmnorm_java.so
          if-no-files-found: error

  # --- Publish ----------------------------------------------------------------------------------

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, cli]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        # Archives and .deb packages (each with a .sha256), versioned and "latest" names; the
        # wheels go to PyPI.
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.sha256

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH == 'true'
    needs: [test, cli]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/dcmnorm/
    permissions:
      id-token: write
    steps:
      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Keep only the wheels
        run: |
          mkdir wheels
          mv dist/*.whl wheels/
          ls -l wheels

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/

  commit-bindings:
    name: Commit rebuilt binding artifacts
    # Only for main or a release tag: a manual run on a feature branch builds and uploads the
    # artifacts (to prove the builds) but never pushes binaries to main.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    needs: [build-node, build-node-windows, build-python, build-java]
    runs-on: ubuntu-24.04
    # Serializes runs for tags pushed in quick succession, which would otherwise race to push
    # to main.
    concurrency:
      group: commit-bindings
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout main
        # Not the triggering ref - that's the pushed tag (immutable, and generally not main's
        # exact tip by the time this job runs), while the rebuilt binaries need to land as a real
        # commit on a branch. The build jobs above build from the tag itself; only where the
        # result lands differs.
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Download Node artifact
        uses: actions/download-artifact@v8
        with:
          name: dcmnorm-node-binary
          path: bindings/node/

      - name: Download Node Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: dcmnorm-node-binary-win32
          path: bindings/node/

      - name: Download Python artifact
        uses: actions/download-artifact@v8
        with:
          name: dcmnorm-python-wheel
          path: bindings/python/dist-new/

      - name: Download Java artifact
        uses: actions/download-artifact@v8
        with:
          name: dcmnorm-java-native
          path: bindings/java/src/main/resources/native/linux-x64/

      - name: Replace the committed wheel
        # The wheel's filename encodes both the package version and the glibc-derived manylinux
        # tag (see bindings/python/build-in-docker.sh's own comment on why that tag is
        # auto-detected, not fixed) - a rebuild without a version bump can still legitimately
        # produce a differently-named file. Clear the old one(s) out first so dist/ never ends up
        # tracking more than the one wheel this run actually produced.
        run: |
          set -euo pipefail
          rm -f bindings/python/dist/*.whl
          mv bindings/python/dist-new/*.whl bindings/python/dist/
          rmdir bindings/python/dist-new

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add bindings/node/dcmnorm-node.linux-x64-gnu.node
          git add bindings/node/dcmnorm-node.win32-x64-msvc.node
          git add bindings/python/dist
          git add bindings/java/src/main/resources/native

          if git diff --cached --quiet; then
            echo "No binary changes to commit"
            exit 0
          fi

          git commit \
            -m "chore(bindings): rebuild native artifacts" \
            -m "Rebuilt by the Build and release workflow (run ${{ github.run_id }}), triggered by ${{ github.ref_name }}."
          git push origin HEAD:main
