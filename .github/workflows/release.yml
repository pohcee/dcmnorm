name: Build and release

# One workflow for everything that builds, tests and publishes dcmnorm.
#
#   pull_request, push to main   test, check the package metadata, build every CLI artifact
#                                (nothing is published; the bindings are not built)
#   push of a v*.*.* tag         the same plus the binding builds, then publish: GitHub release,
#                                crates.io (`dcmnorm`, `dcmnorm-cli`, `dcmtalk` and the
#                                `dcmnorm-*` library crates), PyPI (`dcmnorm` wheels), npm
#                                (`dcmnorm` + `@dcmnorm/<platform>`) and Maven Central (`com.pohcee:dcmnorm` + `dcmnorm-natives`,
#                                plus relocation POMs for the old `dcmnorm-java` names)
#   workflow_dispatch            run on a ref by hand: builds the bindings too; on a tag ref it
#                                publishes like a tag push
#
# Releases start with ./scripts/release-tag.sh <patch|minor|major>, which bumps the Cargo
# versions, the plugin/skill version pins and the binding package versions, commits, and pushes
# the tag with your own git credentials, so the tag push triggers this workflow. If a tag ever
# arrives without a run (GitHub doesn't start workflows for refs pushed with a run's own
# GITHUB_TOKEN), dispatch this workflow by hand with the tag as the ref.
#
# Every publishing job needs the tests, the package checks, every CLI build and every binding
# build to pass. Each registry is switched on by its own repository variable (CRATES_PUBLISH,
# PYPI_PUBLISH, NPM_PUBLISH, MAVEN_PUBLISH = "true") once its one-time setup is done:
# packaging/README.md. crates.io, PyPI and npm use Trusted Publishing (OIDC, no token stored);
# Maven Central uses a Central Portal token and a GPG key from secrets.

on:
  push:
    branches: [main]
    tags:
      - v*.*.*
      - v*.*.*-*
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR supersedes its run; a tag or main run always finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        # ffmpeg: the video transfer syntax round-trip tests run through the ffmpeg command.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config ffmpeg

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        # The bindings link FFmpeg built from source and are built in their own jobs below.
        run: >-
          cargo test --release --locked --workspace
          --exclude dcmnorm-node --exclude dcmnorm-python --exclude dcmnorm-java

      - name: Check generated binding constants
        # Tag/VR/TransferSyntax/SOPClassUID in every binding are generated from the Rust
        # dictionary by crates/dcmnorm-codegen; this fails if the committed files differ.
        run: cargo run --release --locked -p dcmnorm-codegen -- --check

      - name: Check version pins
        # The plugin/skill pins and every binding package version (npm, PyPI, Maven).
        run: python3 scripts/check-versions.py

  packages:
    name: Package metadata
    # Cheap checks of what the binding packages would publish, on every pull request, so their
    # metadata can't drift until a release finds out. Nothing native is compiled here.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm packages (placeholder addons)
        # dcmnorm: the loader + types only; @dcmnorm/<platform>: one .node each, with os/cpu/libc;
        # optionalDependencies and the loader's package names in step. A loader regenerated by
        # `napi build` without `npm run build`'s fix-up shows up as a diff of index.js.
        working-directory: bindings/node
        run: |
          node prepare-npm.js --placeholder
          git diff --exit-code index.js

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: 'bindings/java/**/pom.xml'

      - name: Maven artifacts (no natives, unsigned)
        # The API jar with its sources and javadoc jars, as Central gets them, and the natives POM.
        run: |
          set -euo pipefail
          mvn -B -e -f bindings/java/pom.xml -Prelease -Dgpg.skip package
          ls -l bindings/java/target/*.jar
          if unzip -l bindings/java/target/dcmnorm-*[0-9].jar | grep -q ' native/'; then
            echo "the API jar must not contain native libraries" >&2; exit 1
          fi
          mvn -B -e -f bindings/java/natives/pom.xml package

      - name: Maven Central bundle (placeholder natives, unsigned)
        # The bundle the maven job uploads, built with this runner's Maven and checked against the
        # Central Portal's rules (bindings/java/check-bundle.py): one component directory per
        # artifact with its .pom, sources and javadoc for the API, checksums for every file, and
        # nothing else; exactly com.pohcee:dcmnorm, dcmnorm-natives and the dcmnorm-java /
        # dcmnorm-java-natives relocation POMs. skipUpload never contacts Central; the server
        # entry only satisfies the plugin.
        run: |
          set -euo pipefail
          for entry in linux-x86_64:libdcmnorm_java.so linux-aarch_64:libdcmnorm_java.so \
                       osx-aarch_64:libdcmnorm_java.dylib osx-x86_64:libdcmnorm_java.dylib \
                       windows-x86_64:dcmnorm_java.dll; do
            classifier="${entry%%:*}"
            library="${entry#*:}"
            dir="bindings/java/natives/target/natives/$classifier/native/$classifier"
            mkdir -p "$dir"
            echo placeholder > "$dir/$library"
            (cd "$dir" && sha256sum "$library" > "$library.sha256")
          done
          printf '%s' '<settings><servers><server><id>central</id><username>x</username><password>x</password></server></servers></settings>' > "$RUNNER_TEMP/settings.xml"
          mvn -v | head -1
          mvn -B -e -s "$RUNNER_TEMP/settings.xml" -f bindings/java/natives/pom.xml -Prelease -Dgpg.skip -DskipUpload=true deploy
          python3 bindings/java/check-bundle.py bindings/java/target/central-publishing/central-bundle.zip --unsigned
          rm -rf bindings/java/natives/target bindings/java/target bindings/java/relocation/*/target

      - name: Python package metadata
        # The metadata maturin would put in the wheel (no compile).
        run: |
          set -euo pipefail
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet "maturin>=1.8,<2.0"
          cp LICENSE bindings/python/LICENSE
          # pyproject's data dir is staged from the CLI wheel in release builds; maturin only
          # needs it to exist here.
          mkdir -p bindings/python/data/scripts
          /tmp/venv/bin/maturin pep517 write-dist-info -m bindings/python/Cargo.toml --metadata-directory /tmp/meta
          cat /tmp/meta/*.dist-info/METADATA | head -30
          grep -qx 'Name: dcmnorm' /tmp/meta/*.dist-info/METADATA

  crates:
    name: crates.io packages
    # What `cargo publish` would upload, on every pull request: each published crate packaged and
    # built from its .crate file against the others' (packaging/publish-crates.sh --dry-run), so a
    # missing file, an unpinned path dependency or a manifest crates.io rejects shows up here and
    # not at release time. The version pins are checked in `test`.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Package and verify the crates
        run: packaging/publish-crates.sh --dry-run

  cli:
    name: CLI (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds run in a manylinux_2_28 container (glibc 2.28+), on a runner of the
          # same architecture; see packaging/build-linux.sh.
          - platform: linux-x86_64
            os: ubuntu-24.04
            bin_dir: target/manylinux_2_28-x86_64/release
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            bin_dir: target/manylinux_2_28-aarch64/release
          - platform: macos-aarch64
            os: macos-15
            bin_dir: target/release
            macos_target: "11.0"
          - platform: macos-x86_64
            os: macos-15-intel
            bin_dir: target/release
            macos_target: "10.15"
          - platform: windows-x86_64
            os: windows-2025
            bin_dir: target/release
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        # packaging/*.py use only the standard library; this just gives every runner a `python`.
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache cargo build
        if: ${{ !startsWith(matrix.platform, 'linux-') }}
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      - name: Build (manylinux container)
        if: startsWith(matrix.platform, 'linux-')
        run: packaging/build-linux.sh

      - name: Build
        if: ${{ !startsWith(matrix.platform, 'linux-') }}
        run: cargo build --release --locked -p dcmnorm-cli -p dcmtalk

      - name: Package archives and CLI wheel
        # The CLI-only wheel (py3-none-<platform>) is one of this platform's two PyPI wheels, and
        # the source of the CLI binaries in the other one (build-python).
        shell: bash
        run: python packaging/package.py --platform ${{ matrix.platform }} --bin-dir ${{ matrix.bin_dir }} --out-dir dist

      - name: Smoke test the wheel
        shell: bash
        run: python packaging/smoke_test.py dist/*.whl

      - name: Build .deb packages
        if: startsWith(matrix.platform, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-deb --locked
          # cargo-deb packages target/release/<bin>; put the manylinux binaries there.
          mkdir -p target/release
          cp ${{ matrix.bin_dir }}/dcmnorm ${{ matrix.bin_dir }}/dcmtalk target/release/
          TAG="v$(python -c 'import sys; sys.path.insert(0, "packaging"); import package; print(package.cargo_version())')"
          for BIN in dcmnorm dcmtalk; do
            PKG=$([ "$BIN" = dcmnorm ] && echo dcmnorm-cli || echo dcmtalk)
            cargo deb --no-build --no-strip -p "$PKG"
            SRC="$(ls target/debian/${BIN}_*.deb)"
            for NAME in "${BIN}-${TAG}-${{ matrix.platform }}.deb" "${BIN}-${{ matrix.platform }}.deb"; do
              cp "$SRC" "dist/$NAME"
              (cd dist && sha256sum "$NAME" > "$NAME.sha256")
            done
            rm "$SRC"
          done
          # Install both packages for real and run them.
          sudo apt-get update
          sudo apt-get install -y ./dist/dcmnorm-${{ matrix.platform }}.deb ./dist/dcmtalk-${{ matrix.platform }}.deb
          dcmnorm --version
          dcmtalk --version

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  # --- Bindings -----------------------------------------------------------------------------
  # Built only on release tags and by hand (FFmpeg compiled from source is slow), for the platforms of the CLI matrix, with
  # FFmpeg linked in statically and the same codec set everywhere (the crates' default features:
  # ffmpeg-codec, jpeg-ls-codec, jpeg-xl-codec, jpeg2000-openjpeg-encode; on Windows
  # ffmpeg-codec-linked with vcpkg's static FFmpeg in place of the FFmpeg source build). A codec
  # that fails to build fails the job; there is deliberately no fallback to a smaller feature set.
  #
  # Linux builds run in containers with an old glibc on a runner of the same architecture: the
  # Node addon in node:22-bullseye-slim (glibc 2.31), the Python and Java ones in manylinux_2_28.
  # macOS builds use packaging/macos-link.py as the linker (ffmpeg-sys-next emits GNU-only link
  # flags there) and every Linux/macOS build compiles FFmpeg through packaging/portable-cc (drops
  # the -march=native ffmpeg-sys-next configures, so the result runs on any CPU of its
  # architecture). Each build checks that no FFmpeg shared library is linked and loads the result
  # (a parse and an MPEG-2 round trip, which fails without FFmpeg).

  build-node:
    name: Node (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-24.04
          - platform: linux-arm64-gnu
            os: ubuntu-24.04-arm
          - platform: darwin-arm64
            os: macos-15
            target: aarch64-apple-darwin
            macos_target: "11.0"
          - platform: darwin-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            macos_target: "10.15"
          - platform: win32-x64-msvc
            os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
      CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: ${{ github.workspace }}/packaging/macos-link.py
      CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: ${{ github.workspace }}/packaging/macos-link.py
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build in node:22-bullseye-slim (glibc 2.31; runs smoke.js and load-check.js)
        if: runner.os == 'Linux'
        run: bindings/node/build-in-docker.sh

      - name: Install Rust toolchain
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          key: node-${{ matrix.platform }}

      - name: Set up Node
        if: runner.os != 'Linux'
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install FFmpeg build tools (macOS)
        # git and make come with the runner; nasm is FFmpeg's x86 assembler (not used on arm64).
        if: runner.os == 'macOS'
        run: |
          brew install nasm
          echo "$GITHUB_WORKSPACE/packaging/portable-cc" >> "$GITHUB_PATH"

      - name: FFmpeg (vcpkg)
        if: runner.os == 'Windows'
        uses: ./.github/actions/ffmpeg-vcpkg

      - name: Install npm dependencies
        if: runner.os != 'Linux'
        working-directory: bindings/node
        # No package-lock.json is committed for bindings/node, so `npm ci` can't be used.
        run: npm install --no-audit --no-fund

      - name: Build addon (macOS)
        if: runner.os == 'macOS'
        working-directory: bindings/node
        run: |
          npx napi build --platform --release --target ${{ matrix.target }}
          node prepare-npm.js --fix-loader
          if otool -L dcmnorm-node.${{ matrix.platform }}.node | grep -E 'lib(av|sw|postproc)'; then
            echo "addon links FFmpeg dynamically" >&2; exit 1
          fi

      - name: Build addon (Windows)
        if: runner.os == 'Windows'
        working-directory: bindings/node
        shell: pwsh
        # The default codec set with ffmpeg-codec-linked in place of ffmpeg-codec: jpeg-xl-codec
        # is pure Rust (jxl-oxide), jpeg2000-openjpeg-encode compiles vendored OpenJPEG C with cc,
        # jpeg-ls-codec builds CharLS C++ via cmake, and FFmpeg comes from the vcpkg install above.
        run: |
          npx napi build --platform --release --target x86_64-pc-windows-msvc --no-default-features --features "ffmpeg-codec-linked,jpeg-ls-codec,jpeg-xl-codec,jpeg2000-openjpeg-encode"
          node prepare-npm.js --fix-loader
          pwsh ../../packaging/check-windows-deps.ps1 dcmnorm-node.win32-x64-msvc.node

      - name: Load check
        if: runner.os != 'Linux'
        working-directory: bindings/node
        # Not test/smoke.js - that one is written for the Linux container (glibc check). Proves
        # the .node loads under the runner's Node, parses a DICOM fixture, and that FFmpeg works:
        # us.dcm round-trips through MPEG-2 (FFmpeg's native encoder and decoder) and back.
        run: node load-check.js

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.platform }}
          path: bindings/node/dcmnorm-node.${{ matrix.platform }}.node
          if-no-files-found: error

  build-python:
    name: Python (${{ matrix.platform }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    # The abi3 wheel carries the CLI binaries from this platform's CLI build, byte for byte.
    needs: [cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: macos-aarch64
            os: macos-15
            macos_target: "11.0"
          - platform: macos-x86_64
            os: macos-15-intel
            macos_target: "10.15"
          - platform: windows-x86_64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
      CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: ${{ github.workspace }}/packaging/macos-link.py
      CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: ${{ github.workspace }}/packaging/macos-link.py
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Download this platform's CLI build
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.platform }}
          path: cli-dist

      - name: Stage the CLI binaries
        shell: bash
        run: python packaging/stage_cli.py cli-dist/*.whl

      - name: Build in manylinux_2_28
        if: runner.os == 'Linux'
        run: bindings/python/build-in-docker.sh

      - name: Install Rust toolchain
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          key: python-${{ matrix.platform }}

      - name: Install FFmpeg build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nasm
          echo "$GITHUB_WORKSPACE/packaging/portable-cc" >> "$GITHUB_PATH"

      - name: FFmpeg (vcpkg)
        if: runner.os == 'Windows'
        uses: ./.github/actions/ffmpeg-vcpkg

      - name: Build wheel (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          pip install "maturin>=1.8,<2.0"
          maturin build --release --locked -m bindings/python/Cargo.toml --out bindings/python/dist
          python -m zipfile -e bindings/python/dist/*.whl /tmp/wheel
          if otool -L /tmp/wheel/dcmnorm/*.so | grep -E 'lib(av|sw|postproc)'; then
            echo "extension links FFmpeg dynamically" >&2; exit 1
          fi

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pip install "maturin>=1.8,<2.0"
          maturin build --release --locked -m bindings/python/Cargo.toml --out bindings/python/dist --no-default-features --features "pyo3/extension-module,ffmpeg-codec-linked,jpeg-ls-codec,jpeg-xl-codec,jpeg2000-openjpeg-encode"
          if ($LASTEXITCODE -ne 0) { throw 'maturin build failed' }
          $wheel = Get-ChildItem bindings/python/dist/*.whl | Select-Object -First 1
          python -m zipfile -e $wheel.FullName "$env:RUNNER_TEMP\wheel"
          $pyd = Get-ChildItem "$env:RUNNER_TEMP\wheel\dcmnorm\*.pyd" | Select-Object -First 1
          pwsh packaging/check-windows-deps.ps1 $pyd.FullName

      - name: Smoke test the wheel
        # Installs it into a fresh venv: both CLIs on PATH, `import dcmnorm` with an in-process
        # MPEG-2 round trip, and the CLI binaries identical to the CLI-only wheel's.
        shell: bash
        run: python packaging/smoke_test.py bindings/python/dist/*.whl --same-cli-as cli-dist/*.whl

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.platform }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  build-java:
    name: Java (${{ matrix.classifier }})
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    # The Linux smoke test drives this platform's dcmtalk as the DIMSE peer.
    needs: [cli]
    strategy:
      fail-fast: false
      matrix:
        include:
          - classifier: linux-x86_64
            os: ubuntu-24.04
            cli: linux-x86_64
          - classifier: linux-aarch_64
            os: ubuntu-24.04-arm
            cli: linux-aarch64
          - classifier: osx-aarch_64
            os: macos-15
            macos_target: "11.0"
            library: libdcmnorm_java.dylib
          - classifier: osx-x86_64
            os: macos-15-intel
            macos_target: "10.15"
            library: libdcmnorm_java.dylib
          - classifier: windows-x86_64
            os: windows-latest
            library: dcmnorm_java.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
      CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER: ${{ github.workspace }}/packaging/macos-link.py
      CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER: ${{ github.workspace }}/packaging/macos-link.py
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build in manylinux_2_28
        if: runner.os == 'Linux'
        run: bindings/java/build-in-docker.sh

      - name: Install Rust toolchain
        if: runner.os != 'Linux'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        if: runner.os != 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          key: java-${{ matrix.classifier }}

      - name: Install FFmpeg build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install nasm
          echo "$GITHUB_WORKSPACE/packaging/portable-cc" >> "$GITHUB_PATH"

      - name: FFmpeg (vcpkg)
        if: runner.os == 'Windows'
        uses: ./.github/actions/ffmpeg-vcpkg

      - name: Build library (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          cargo build --release --locked -p dcmnorm-java
          if otool -L target/release/${{ matrix.library }} | grep -E 'lib(av|sw|postproc)'; then
            echo "library links FFmpeg dynamically" >&2; exit 1
          fi
          python bindings/java/stage-native.py ${{ matrix.classifier }} target/release/${{ matrix.library }}

      - name: Build library (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --locked -p dcmnorm-java --no-default-features --features "ffmpeg-codec-linked,jpeg-ls-codec,jpeg-xl-codec,jpeg2000-openjpeg-encode"
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
          pwsh packaging/check-windows-deps.ps1 target/release/${{ matrix.library }}
          python bindings/java/stage-native.py ${{ matrix.classifier }} target/release/${{ matrix.library }}

      - name: Download this platform's CLI build (Linux)
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.cli }}
          path: cli-dist

      - name: Package and check the jars (Linux, with the DIMSE smoke test)
        if: runner.os == 'Linux'
        # Smoke.java's renderMovie muxes MP4 through the ffmpeg command.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          tar -xzf cli-dist/dcmtalk-${{ matrix.cli }}.tar.gz -C cli-dist dcmtalk
          bindings/java/check-natives.sh ${{ matrix.classifier }} "$PWD/cli-dist/dcmtalk"

      - name: Package and check the jars
        if: runner.os != 'Linux'
        shell: bash
        run: bindings/java/check-natives.sh ${{ matrix.classifier }}

      - name: Upload staged library
        # What the maven job packages into this classifier's natives jar.
        uses: actions/upload-artifact@v7
        with:
          name: java-natives-${{ matrix.classifier }}
          path: bindings/java/natives/target/natives/${{ matrix.classifier }}/
          if-no-files-found: error

      - name: Upload natives jar
        # For the GitHub release.
        uses: actions/upload-artifact@v7
        with:
          name: java-natives-jar-${{ matrix.classifier }}
          path: bindings/java/natives/target/dcmnorm-natives-*-${{ matrix.classifier }}.jar
          if-no-files-found: error

  # --- Publish ----------------------------------------------------------------------------------

  github-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, packages, crates, cli, build-node, build-python, build-java]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        # Before the download: checkout cleans the workspace.
        uses: actions/checkout@v7

      - name: Download CLI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Download binding artifacts
        # The Node addons, the abi3 wheels and the Java natives jars, for downloads outside the
        # registries (each also on npm, PyPI or Maven Central).
        uses: actions/download-artifact@v8
        with:
          pattern: "{node,wheel,java-natives-jar}-*"
          path: bindings-dist
          merge-multiple: true

      - name: Package the agent plugin for Gemini CLI
        # `gemini extensions install https://github.com/pohcee/dcmnorm` (and the extensions
        # gallery's crawler) installs from the latest release: an asset named
        # `<platform>.<name>.tar.gz` with gemini-extension.json at its root. The plugin is the
        # same on every platform, so it ships once per platform name. The CLI archives
        # (dcmnorm-...) don't start with a platform name, so they are never picked instead.
        # No .sha256 for these: Gemini CLI takes the first asset whose name starts with
        # "<platform>.", and a "linux.dcmnorm.tar.gz.sha256" could be that one.
        run: |
          set -euo pipefail
          for platform in linux darwin win32; do
            tar -czf "dist/${platform}.dcmnorm.tar.gz" -C plugin .
          done
          # grep -q would exit at the first match and fail tar with a write error under pipefail
          tar -tzf dist/linux.dcmnorm.tar.gz | grep -x './gemini-extension.json' > /dev/null

      - name: Create GitHub release
        # Archives and .deb packages (each with a .sha256), versioned and "latest" names, the
        # Gemini CLI extension archives and the binding artifacts. The CLI-only wheels go to PyPI.
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.sha256
            bindings-dist/*.node
            bindings-dist/*.whl
            bindings-dist/*.jar

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/') && vars.PYPI_PUBLISH == 'true'
    needs: [test, packages, crates, cli, build-node, build-python, build-java]
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/dcmnorm/
    permissions:
      id-token: write
    steps:
      - name: Download CLI wheels
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Download binding wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: wheels
          merge-multiple: true

      - name: Collect the wheels
        # Two per platform: dcmnorm-<v>-cp39-abi3-<plat>.whl (extension module + CLIs; what
        # CPython 3.9+ installs) and dcmnorm-<v>-py3-none-<plat>.whl (CLIs only; what installers
        # take where the abi3 one doesn't fit: CPython 3.8, free-threaded builds, other Pythons).
        run: |
          set -euo pipefail
          mv dist/*.whl wheels/
          ls -l wheels
          test "$(find wheels -name '*-py3-none-*.whl' | wc -l)" = 5
          test "$(find wheels -name '*-cp39-abi3-*.whl' | wc -l)" = 5

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheels/
          # A re-run after a partial upload publishes what is missing.
          skip-existing: true

  npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/') && vars.NPM_PUBLISH == 'true'
    needs: [test, packages, crates, cli, build-node, build-python, build-java]
    runs-on: ubuntu-24.04
    environment:
      name: npm
      url: https://www.npmjs.com/package/dcmnorm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        # Trusted Publishing (OIDC) needs npm 11.5.1 or newer.
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Download the addons
        uses: actions/download-artifact@v8
        with:
          pattern: node-*
          path: bindings/node/artifacts
          merge-multiple: true

      - name: Lay out and check the packages
        working-directory: bindings/node
        run: |
          set -euo pipefail
          node prepare-npm.js --artifacts artifacts > publish-order.txt
          cat publish-order.txt

      - name: Publish (platform packages first, then dcmnorm)
        # --provenance links each package to this workflow run. A version already on npm (a
        # re-run after a partial publish) is skipped. Prerelease versions go to the "next"
        # dist-tag, so `npm i dcmnorm` keeps installing the latest release.
        working-directory: bindings/node
        env:
          # Only for a first publish before trusted publishing is configured; see
          # packaging/README.md. Unset, npm authenticates by OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          while read -r dir; do
            name=$(node -p "require('./$dir/package.json').name")
            version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already published"
              continue
            fi
            tag=latest
            case "$version" in *-*) tag=next ;; esac
            (cd "$dir" && npm publish --provenance --access public --tag "$tag")
          done < publish-order.txt

  maven:
    name: Publish to Maven Central
    if: startsWith(github.ref, 'refs/tags/') && vars.MAVEN_PUBLISH == 'true'
    needs: [test, packages, crates, cli, build-node, build-python, build-java]
    runs-on: ubuntu-24.04
    environment:
      name: maven-central
      url: https://central.sonatype.com/artifact/com.pohcee/dcmnorm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java, the Central Portal credentials and the signing key
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Download the native libraries
        uses: actions/download-artifact@v8
        with:
          pattern: java-natives-*
          path: bindings/java/natives/target/natives
          merge-multiple: false

      - name: Drop the jar artifacts
        # java-natives-jar-* came along with the pattern; the natives POM rebuilds its jars from
        # the staged libraries in java-natives-<classifier>/.
        run: |
          set -euo pipefail
          cd bindings/java/natives/target/natives
          rm -rf java-natives-jar-*
          for dir in java-natives-*; do mv "$dir" "${dir#java-natives-}"; done
          find . -type f | sort

      - name: Build and check the bundle
        # One reactor (natives/pom.xml's release profile includes ../pom.xml and the relocation
        # POMs in ../relocation/), so all four artifacts go to Central as a single deployment that
        # is validated and published as a whole.
        # -Prelease requires all five platforms and signs every file. Checked against the portal's
        # rules before anything is uploaded (bindings/java/check-bundle.py).
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          mvn -v | head -1
          mvn -B -f bindings/java/natives/pom.xml -Prelease -DskipUpload=true deploy
          python3 bindings/java/check-bundle.py bindings/java/target/central-publishing/central-bundle.zip
          rm -rf bindings/java/target/central-* bindings/java/natives/target/central-*

      - name: Publish dcmnorm, dcmnorm-natives and the dcmnorm-java relocations
        # The same build again, now uploading; waits until Central reports the deployment
        # published.
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn -B -f bindings/java/natives/pom.xml -Prelease deploy

  crates-io:
    name: Publish to crates.io
    if: startsWith(github.ref, 'refs/tags/') && vars.CRATES_PUBLISH == 'true'
    needs: [test, packages, crates, cli, build-node, build-python, build-java]
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
      url: https://crates.io/crates/dcmnorm
    permissions:
      contents: read
      id-token: write
    env:
      # Only for the first publish, before each crate's trusted publisher exists (crates.io
      # configures them on existing crates); see packaging/README.md. Unset, the job
      # authenticates by OIDC.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        # cargo publish builds each crate before uploading it.
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Authenticate to crates.io (Trusted Publishing)
        id: auth
        if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        # Every crate whose version crates.io lacks, in dependency order; a re-run after a
        # partial publish uploads what is missing.
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: packaging/publish-crates.sh

  plugin-branch:
    name: Update the claude-plugin branch
    # The Claude plugin directory tracks the claude-plugin branch (plugin/ only; the repository is
    # over its download size limit). Point it at this release's plugin/, whose version pins
    # release-tag.sh just set; see scripts/update-plugin-branch.sh. The skill installs that
    # version from PyPI, so this waits for everything PyPI publishing waits for.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, packages, crates, cli, build-node, build-python, build-java]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Update and push the branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          scripts/update-plugin-branch.sh "$GITHUB_SHA" --push
