name: Build and Release CLIs

on:
  push:
    tags:
      - v*.*.*
      - v*.*.*-*
  # Manual fallback: the SemVer Tag workflow (semver-tag.yml) pushes its tag using the Actions
  # run's own GITHUB_TOKEN, which GitHub deliberately excludes from triggering other workflows
  # (anti-recursion protection) - so a tag created that way does NOT, on its own, fire this
  # workflow's `push: tags:` trigger above. `./scripts/release-tag.sh`, run locally with a
  # human's own git credentials, doesn't hit this - only the in-Actions path does. Dispatch this
  # manually (ref: the tag itself, e.g. `v0.4.0`) to recover when that happens.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    # Pinned, not ubuntu-latest: the released CLI binaries/debs link against the runner's glibc,
    # so an OS bump is a compatibility change to make deliberately (same pin in every workflow).
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install native dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            libc6-dev \
            libclang-dev \
            pkg-config \
            nasm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deb
        shell: bash
        run: cargo install cargo-deb --locked

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          cargo build --package dcmnorm-cli --package dcmtalk --release

      - name: Build .deb packages
        shell: bash
        run: |
          set -euo pipefail
          cargo deb --no-build -p dcmnorm-cli
          cargo deb --no-build -p dcmtalk

      - name: Package release artifacts
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p dist

          FILES=()
          for BINARY_NAME in dcmnorm dcmtalk; do
            ARCHIVE="${BINARY_NAME}-${TAG}-linux-x86_64.tar.gz"
            CHECKSUM="${ARCHIVE}.sha256"
            LATEST_ARCHIVE="${BINARY_NAME}-linux-x86_64.tar.gz"
            LATEST_CHECKSUM="${LATEST_ARCHIVE}.sha256"

            cp "target/release/${BINARY_NAME}" dist/
            cp README.md dist/
            cp LICENSE dist/

            tar -C dist -czf "$ARCHIVE" "${BINARY_NAME}" README.md LICENSE
            sha256sum "$ARCHIVE" > "$CHECKSUM"

            cp "$ARCHIVE" "$LATEST_ARCHIVE"
            sha256sum "$LATEST_ARCHIVE" > "$LATEST_CHECKSUM"

            FILES+=("$ARCHIVE" "$CHECKSUM" "$LATEST_ARCHIVE" "$LATEST_CHECKSUM")

            # cargo-deb names the file `<name>_<version>-<deb-revision>_<arch>.deb`; glob for it
            # rather than hardcoding the version/revision/arch.
            DEB_SRC="$(ls target/debian/${BINARY_NAME}_*.deb)"
            DEB="${BINARY_NAME}-${TAG}-linux-x86_64.deb"
            DEB_CHECKSUM="${DEB}.sha256"
            LATEST_DEB="${BINARY_NAME}-linux-x86_64.deb"
            LATEST_DEB_CHECKSUM="${LATEST_DEB}.sha256"

            cp "$DEB_SRC" "$DEB"
            sha256sum "$DEB" > "$DEB_CHECKSUM"

            cp "$DEB" "$LATEST_DEB"
            sha256sum "$LATEST_DEB" > "$LATEST_DEB_CHECKSUM"

            FILES+=("$DEB" "$DEB_CHECKSUM" "$LATEST_DEB" "$LATEST_DEB_CHECKSUM")
          done

          {
            echo "files<<FILES_EOF"
            printf '%s\n' "${FILES[@]}"
            echo "FILES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: ${{ steps.package.outputs.files }}
